<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" />

  <!-- Outer Tech Circuit Node Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Glowing Nodes -->
  <circle cx="26" cy="36" r="3.5" fill="#38BDF8" />
  <circle cx="102" cy="92" r="3.5" fill="#38BDF8" />
  <circle cx="102" cy="36" r="3" fill="#A78BFA" opacity="0.8" />
  <circle cx="26" cy="92" r="3" fill="#A78BFA" opacity="0.8" />

  <!-- Monogram SAM -->
  <text x="64" y="74" 
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" 
        font-size="41" 
        font-weight="900" 
        letter-spacing="1.5"
        fill="#FFFFFF" 
        text-anchor="middle">SAM</text>

  <!-- Subtitle Badge / AGENT indicator line -->
  <rect x="42" y="86" width="44" height="4.5" rx="2.25" fill="url(#accentGrad)" />
</svg>